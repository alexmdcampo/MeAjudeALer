version: '3.8'

services:
  meajudealear:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meajudealear
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Volume nomeado para evitar problemas de permissão no host
      - meajudea_data:/app/data/texts
    environment:
      - NODE_ENV=production
      - DATA_PATH=/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  meajudea_data:
